# Keypoint-guided I-JEPA pretraining on ISRO GSAT-12R (train split of cv fold 1 only; test images never seen).
data:
  dataset_name: isro
  root_path: /home/kavinder/ISROGSAT12RDataset
  camera_file: /home/kavinder/SPACE-HOP/configs/isro_camera.json
  fold: 1
  batch_size: 64
  color_jitter_strength: 0.5
  crop_scale: [0.3, 1.0]        # unused for isro (no RandomResizedCrop)
  crop_size: 224
  image_folder: null
  num_workers: 12
  pin_mem: true
  use_color_distortion: true
  use_gaussian_blur: true
  use_horizontal_flip: false
logging:
  folder: /home/kavinder/SPACE-HOP/checkpoints/jepa_isro
  write_tag: jepa_isro
  checkpoint_freq: 50
mask:
  allow_overlap: false
  aspect_ratio: [0.75, 1.5]
  enc_mask_scale: [0.85, 1.0]
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 16
  pred_mask_scale: [0.15, 0.2]
meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_base
  pred_depth: 12
  pred_emb_dim: 384
  read_checkpoint: null
  use_bfloat16: true
  project_name: sat-jepa-isro
optimization:
  ema: [0.996, 1.0]
  epochs: 100
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 6.25e-5          # 1e-3 @ bs1024 in the SPEED+ config, linearly scaled to bs64 (fits ~19 GB free on the shared GPU)
  start_lr: 1.25e-5
  warmup: 10
  weight_decay: 0.04
